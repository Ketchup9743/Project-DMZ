name: Build Project DMZ APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'build-dmz.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for project ZIP
        run: |
          test -f build-dmz.zip || { echo 'build-dmz.zip is missing from the repository root.'; exit 1; }

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o build-dmz.zip -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle.kts -type f -print -quit)")"
          if [ "$PROJECT_DIR" = "extracted" ] || [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo 'Could not find settings.gradle.kts in the ZIP.'
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: project-dmz-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
